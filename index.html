.q{font-size:1.08rem;font-weight:600;margin:0 0 10px;color:var(--tx)}
.ok{background:var(--okb)!important;border-color:var(--ok)!important}.bad{background:var(--badb)!important;border-color:var(--bad)!important}.sel{border-color:var(--pri)!important;box-shadow:0 0 0 2px var(--pri) inset}

.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}
button i{margin-right:6px}.t i{margin:0}
.noselect{user-select:none;-webkit-user-select:none}

.brand{font-weight:800;font-size:1.1rem;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
